---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
#
# href = public name through Caddy (http://<svc>.gider), since the browser
# can't resolve podman container names. siteMonitor = container name, since
# homepage runs its checks from inside the home network.

- Media:
    - Sonarr:
        href: http://sonarr.gider
        siteMonitor: http://sonarr:8989
        description: TV shows
    - Radarr:
        href: http://radarr.gider
        siteMonitor: http://radarr:7878
        description: Movies
    - Prowlarr:
        href: http://prowlarr.gider
        siteMonitor: http://prowlarr:9696
        description: Indexer management
    - qBittorrent:
        href: http://qbittorrent.gider
        siteMonitor: http://qbittorrent:8080
        description: Download client

- Media Servers:
    - Jellyfin:
        href: http://jellyfin.gider
        siteMonitor: http://jellyfin:8096
        description: Media server

- AI:
    - Open WebUI:
        href: http://open-webui.gider
        siteMonitor: http://open-webui:8080
        description: LLM chat interface
    - ComfyUI:
        href: http://comfyui.gider
        siteMonitor: http://comfyui:8188
        description: Stable Diffusion workflow UI
    - llama.cpp:
        href: http://llamacpp.gider
        siteMonitor: http://llamacpp:8080
        description: LLM inference server